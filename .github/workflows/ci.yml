name: CorSystem CI

on:
  pull_request:
    branches:
      - develop
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: corsystem-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Prisma validate and Next build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: mysql://corsystem:ci-only@127.0.0.1:3306/corsystem_ci
      REPAIRNOTE_ADMIN_USERNAME: admin
      REPAIRNOTE_ADMIN_PASSWORD: ci-only-not-for-production
      REPAIRNOTE_COOKIE_SECURE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Next.js application
        run: npm run build

  migrations:
    name: CorSystem migrations and legacy backfill
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: corsystem_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/corsystem_ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate legacy schema fixture
        run: npx prisma validate --schema=prisma/schema.legacy.prisma

      - name: Create legacy RepairNOTE schema
        run: npx prisma db push --schema=prisma/schema.legacy.prisma --skip-generate

      - name: Seed legacy repair history
        run: npx prisma db execute --schema=prisma/schema.legacy.prisma --file=prisma/migration-tests/seed_legacy.sql

      - name: Apply Device migration SQL
        run: npx prisma db execute --schema=prisma/schema.legacy.prisma --file=prisma/migrations/20260831173000_add_devices/migration.sql

      - name: Apply Diagnosis and Quote migration SQL
        run: npx prisma db execute --schema=prisma/schema.legacy.prisma --file=prisma/migrations/20260831183000_add_diagnosis_quotes/migration.sql

      - name: Generate current Prisma client
        run: npx prisma generate --schema=prisma/schema.prisma

      - name: Verify Device backfill
        run: node scripts/test-device-migration.mjs

      - name: Verify Diagnosis and Quote backfill
        run: node scripts/test-workflow-migration.mjs
