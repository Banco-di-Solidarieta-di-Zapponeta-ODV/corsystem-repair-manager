name: Apply CorSystem Italian localization

on:
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:
  apply-italian:
    if: github.head_ref == 'feature/client-device-intake'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 1

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Apply Italian legacy localization
        run: node scripts/localize-legacy-italian.mjs

      - name: Verify Italian defaults
        run: node scripts/test-italian-defaults.mjs

      - name: Commit generated localization
        shell: bash
        run: |
          if git diff --quiet -- src/app/page.jsx src/lib/seed-data.js; then
            echo "Italian localization already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/page.jsx src/lib/seed-data.js
          git commit -m "feat(i18n): make Italian the default legacy language"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
